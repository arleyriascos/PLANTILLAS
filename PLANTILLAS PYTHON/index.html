<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi caso de estudio</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
    button { padding: 8px 12px; margin: 4px 0; }
    input { padding: 8px; }
    ul { background: #f0f0f0; padding: 15px 30px; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>Título de tu caso</h2>
  <input id="inputDato" placeholder="Escribe un dato">
  <button id="btnAgregar">Agregar</button>
  <button id="btnQuitar">Quitar</button>
  <ul id="lista"></ul>

  <script>
    // ============================
    // 1. LA ESTRUCTURA (elige UNA de las tres de abajo y bórralas las otras)
    // ============================

    // ---- OPCIÓN A: COLA (FIFO) ----
    class Cola {
      constructor() { this.items = []; }
      enqueue(el) { this.items.push(el); }        // entra al final
      dequeue() { return this.items.shift(); }     // sale del primero
      isEmpty() { return this.items.length === 0; }
    }

    // ---- OPCIÓN B: PILA (LIFO) ----
    class Pila {
      constructor() { this.items = []; }
      push(el) { this.items.push(el); }            // entra arriba
      pop() { return this.items.pop(); }            // sale de arriba
      isEmpty() { return this.items.length === 0; }
    }

    // ---- OPCIÓN C: LISTA (acceso libre) ----
    class Lista {
      constructor() { this.items = []; }
      agregar(el) { this.items.push(el); }
      eliminar(indice) { this.items.splice(indice, 1); }
      buscar(valor) { return this.items.find(el => el === valor); }
    }

    // ============================
    // 2. USAR la estructura (cambia "Cola" por la que elegiste)
    // ============================
    const estructura = new Cola();

    // ============================
    // 3. CONECTAR con los botones (esto casi nunca cambia)
    // ============================
    document.getElementById('btnAgregar').addEventListener('click', () => {
      const valor = document.getElementById('inputDato').value.trim();
      if (valor === '') return;
      estructura.enqueue(valor);      // <- cambia el nombre del método según tu clase
      document.getElementById('inputDato').value = '';
      actualizarPantalla();
    });

    document.getElementById('btnQuitar').addEventListener('click', () => {
      estructura.dequeue();           // <- cambia el nombre del método según tu clase
      actualizarPantalla();
    });

    function actualizarPantalla() {
      const ul = document.getElementById('lista');
      ul.innerHTML = '';
      estructura.items.forEach(el => {
        const li = document.createElement('li');
        li.textContent = el;
        ul.appendChild(li);
      });
    }
  </script>
</body>
</html>
